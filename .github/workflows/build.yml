name: Jobs

on: [push]

env:
  CARGO_TERM_COLOR: always
  rust_toolchain: nightly

jobs:
  build-doc:
    if: github.repository == 'LearningOS/rCore-Camp-Code-2025S'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build doc
        run: |
          git clone https://github.com/LearningOS/rCore-Tutorial-Test-2025S.git user
          cd os
          make
          cargo doc --no-deps --verbose
      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./os/target/riscv64gc-unknown-none-elf/doc
          destination_dir: ${{ github.ref_name }}
  basic-test:
    runs-on: ubuntu-latest
    outputs:
      points: ${{ steps.end.outputs.points}}
    container:
      image: duskmoon/dev-env:rcore-ci
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust registry
        run: |
          # Remove any existing cargo config
          rm -rf ~/.cargo
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << EOF
          [source.crates-io]
          replace-with = "ustc"

          [source.ustc]
          registry = "https://mirrors.ustc.edu.cn/crates.io-index"
          EOF
          # Also set environment variable to override any registry
          echo "CARGO_REGISTRIES_CRATES_IO_INDEX=https://mirrors.ustc.edu.cn/crates.io-index" >> $GITHUB_ENV
      - name: Run tests
        run: |
          qemu-system-riscv64 --version
          rustup target add riscv64gc-unknown-none-elf
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          git clone https://github.com/LearningOS/rCore-Tutorial-Checker-2025S.git ci-user
          git clone https://github.com/LearningOS/rCore-Tutorial-Test-2025S.git ci-user/user
          # Force override any existing cargo configs
          find . -name ".cargo" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "config.toml" -path "*/.cargo/*" -delete 2>/dev/null || true
          # Setup cargo config for all directories
          mkdir -p ~/.cargo
          mkdir -p ci-user/.cargo
          mkdir -p ci-user/user/.cargo
          for dir in ~/.cargo ci-user/.cargo ci-user/user/.cargo; do
            cat > $dir/config.toml << EOF
          [source.crates-io]
          replace-with = "ustc"

          [source.ustc]
          registry = "https://mirrors.ustc.edu.cn/crates.io-index"
          EOF
          done
          # Set environment variables to force registry
          export CARGO_REGISTRIES_CRATES_IO_INDEX=https://mirrors.ustc.edu.cn/crates.io-index
          export CARGO_HOME=~/.cargo
          ID=`git rev-parse --abbrev-ref HEAD | grep -oP 'ch\K[0-9]'`
          # cd ci-user && make test CHAPTER=$ID passwd=${{ secrets.BASE_TEST_TOKEN }}
          cd ci-user && CARGO_REGISTRIES_CRATES_IO_INDEX=https://mirrors.ustc.edu.cn/crates.io-index make test CHAPTER=$ID passwd=${{ secrets.BASE_TEST_TOKEN }} > ../output.txt
          cat ../output.txt
      - name: end
        id: end
        run: |
          cat output.txt | grep -a "Test passed" | grep -oP "\d{1,}/\d{1,}" | xargs -i echo "points={}"
          cat output.txt | grep -a "Test passed" | grep -oP "\d{1,}/\d{1,}" | xargs -i echo "points={}" >> $GITHUB_OUTPUT
  deploy:
    if: github.repository != 'LearningOS/rCore-Camp-Code-2025S'
    name: Deploy to pages
    needs: basic-test
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v3
        continue-on-error: true
        with:
          ref: 'gh-pages'
      - name: Save Log File
        uses: yfblock/multi-rank-log@main
        with:
          public-dir: classroom
          points: ${{ needs.basic-test.outputs.points }}
      - name: GitHub Pages
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: gh-pages
          build_dir: ./classroom
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: check score
        env:
          course_id: ${{ secrets.RCORE_2025_SPRING_COURSE_ID }}
          post_api: ${{ secrets.RCORE_2025_SPRING_POST_API }}
          token: ${{ secrets.RCORE_2025_SPRING_TOKEN }}
        run: |
          score=$(( $(grep -o 'ch' classroom/latest.json | wc -l) * 100))
          cat classroom/latest.json
          echo $score

          github_user="${{ github.actor }}"

          # 生成 JSON 结果
          score_json=$(jq -n \
            --arg channel "github" \
            --argjson courseId "$course_id" \
            --arg name "$github_user" \
            --argjson score "$score" \
            --argjson totalScore 500 \
            '{channel: $channel, courseId: $courseId, name: $name, score: $score, totalScore: $totalScore}')

            response=$(curl -X POST $post_api \
            -H "accept: application/json;charset=utf-8" \
            -H "Content-Type: application/json" \
            -H "token: $token" \
            -d "$score_json" \
            -v)

            echo "Response: $response"

            if echo "$response" | grep -q '"result":1'; then
            echo "Success: The result field contains 1."
            else
            echo "Error: The result field does not contain 1."
            exit 1
            fi
